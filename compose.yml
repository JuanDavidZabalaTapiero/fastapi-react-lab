services:
  postgres:
    image: postgres:18.6

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fastapi_react_lab

    ports:
      - "5432:5432"

  pgadmin:
    image: dpage/pgadmin4:9.17

    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin

    ports:
      - "5050:80"

    depends_on:
      - postgres
